spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB
  devtools:
    restart:
      enabled: true
      exclude: static/**,public/**,templates/**
    livereload:
      enabled: true

# Jasypt 加密配置
jasypt:
  encryptor:
    password: ${JASYPT_ENCRYPTOR_PASSWORD}
    algorithm: PBEWithMD5AndDES
    iv-generator-classname: org.jasypt.iv.NoIvGenerator

# JWT 配置
jwt:
  secret: ${JWT_SECRET:lawoffice_jwt_secret_key_2026_change_this_in_production}

# Shiro 配置
shiro:
  # 是否启用Shiro
  enabled: true
  # 登录URL（未认证时跳转）
  loginUrl: /api/auth/login
  # 成功URL
  successUrl: /api/
  # 未授权URL
  unauthorizedUrl: /api/403
