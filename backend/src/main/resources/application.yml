spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB
  devtools:
    restart:
      enabled: true
      exclude: static/**,public/**,templates/**
    livereload:
      enabled: true

# Jasypt 加密配置
jasypt:
  encryptor:
    password: ${JASYPT_ENCRYPTOR_PASSWORD}
    algorithm: PBEWithMD5AndDES
    iv-generator-classname: org.jasypt.iv.NoIvGenerator

# JWT 配置
jwt:
  secret: ${JWT_SECRET:lawoffice_jwt_secret_key_2026_change_this_in_production}

# ONLYOFFICE 配置
onlyoffice:
  enabled: ${ONLYOFFICE_ENABLED:false}
  document-server-url: ${ONLYOFFICE_DOCUMENT_SERVER_URL:http://localhost:8088}
  server-base-url: ${ONLYOFFICE_SERVER_BASE_URL:http://host.docker.internal:8080/api}
  jwt-secret: ${ONLYOFFICE_JWT_SECRET:lawoffice_onlyoffice_jwt_secret_2026_change_this}
  preview-token-minutes: ${ONLYOFFICE_PREVIEW_TOKEN_MINUTES:10}
  callback-token-minutes: ${ONLYOFFICE_CALLBACK_TOKEN_MINUTES:1440}
  render-version: ${ONLYOFFICE_RENDER_VERSION:fonts-20260602-alias3}

# Shiro 配置
shiro:
  # 是否启用Shiro
  enabled: true
  # 登录URL（未认证时跳转）
  loginUrl: /api/auth/login
  # 成功URL
  successUrl: /api/
  # 未授权URL
  unauthorizedUrl: /api/403
