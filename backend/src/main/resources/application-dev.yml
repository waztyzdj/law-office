server:
  port: 8080
  servlet:
    context-path: /api

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/law_office?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ENC(s1KJZw1FYmsTh5ATEhpqZNZV3kujRTEx)
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      # 初始连接数
      initial-size: 5
      # 最小连接池数量
      min-idle: 5
      # 最大连接池数量
      max-active: 20
      # 获取连接等待超时的时间
      max-wait: 60000
      # 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
      time-between-eviction-runs-millis: 60000
      # 配置一个连接在池中最小生存的时间，单位是毫秒
      min-evictable-idle-time-millis: 300000
      # 配置一个连接在池中最大生存的时间，单位是毫秒
      max-evictable-idle-time-millis: 900000
      # 配置检测连接是否有效
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      # 开启监控统计功能
      web-stat-filter:
        enabled: true
        url-pattern: /*
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        login-username: admin
        login-password: admin123
        reset-enable: false
  
  # Redis 配置
  data:
    redis:
      host: localhost
      port: 6379
      password: redis@6379
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          # 连接池最大连接数
          max-active: 8
          # 连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1ms
          # 连接池中的最大空闲连接
          max-idle: 8
          # 连接池中的最小空闲连接
          min-idle: 0

# Swagger 配置
swagger:
  enabled: true
  username: ENC(KdCZL8b6rJOQRz39Db1xpQ==)
  password: ENC(5jL8xygiZZyVsZvtMfigjuNtPuOkVucc)

# MinIO 配置
minio:
  endpoint: http://localhost:9000
  access-key: admin
  secret-key: minio@9000
  bucket-name: law-office

# ONLYOFFICE 配置（本地开发）
onlyoffice:
  enabled: true
  document-server-url: http://localhost:8088
  server-base-url: http://host.docker.internal:8080/api
  jwt-secret: lawoffice_onlyoffice_jwt_secret_2026_change_this
  preview-token-minutes: 10
  render-version: fonts-20260602-alias3

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.lawoffice.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.lawoffice: debug
    org.springframework.web: debug
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n'
