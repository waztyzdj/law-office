server:
  port: 8080

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/law_office?useUnicode=true&characterEncoding=utf8&useSSL=true&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ENC(s1KJZw1FYmsTh5ATEhpqZNZV3kujRTEx)
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      # 初始连接数
      initial-size: 10
      # 最小连接池数量
      min-idle: 20
      # 最大连接池数量
      max-active: 50
      # 获取连接等待超时的时间
      max-wait: 60000
      # 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
      time-between-eviction-runs-millis: 60000
      # 配置一个连接在池中最小生存的时间，单位是毫秒
      min-evictable-idle-time-millis: 300000
      # 配置一个连接在池中最大生存的时间，单位是毫秒
      max-evictable-idle-time-millis: 900000
      # 配置检测连接是否有效
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      # 开启监控统计功能（生产环境建议关闭或加强安全）
      web-stat-filter:
        enabled: true
        url-pattern: /*
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"
      stat-view-servlet:
        enabled: false
  
  # Redis 配置（生产环境）
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis@6379}
      database: ${REDIS_DATABASE:0}
      timeout: 5000ms
      lettuce:
        pool:
          # 连接池最大连接数（生产环境调大）
          max-active: 20
          # 连接池最大阻塞等待时间
          max-wait: 3000ms
          # 连接池中的最大空闲连接
          max-idle: 10
          # 连接池中的最小空闲连接
          min-idle: 5
        # 集群模式配置（如果使用Redis集群，取消注释并配置）
        # cluster:
        #   nodes:
        #     - ${REDIS_CLUSTER_NODES:localhost:6379,localhost:6380,localhost:6381}
        #   max-redirects: 3

# Swagger 配置（生产环境禁用）
swagger:
  enabled: false
  username: ENC(KdCZL8b6rJOQRz39Db1xpQ==)
  password: ENC(5jL8xygiZZyVsZvtMfigjuNtPuOkVucc)

# MinIO 配置（生产环境）
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:admin}
  secret-key: ${MINIO_SECRET_KEY:minio@9000}
  bucket-name: ${MINIO_BUCKET_NAME:law-office}

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.lawoffice.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

logging:
  level:
    com.lawoffice: info
    org.springframework.web: info
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n'
